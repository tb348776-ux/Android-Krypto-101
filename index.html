<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ANDROID KRYPTO 101</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
          width: 6px;
          height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
          background: #171717; 
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
          background: #431407; 
          border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
          background: #f97316; 
      }

      body {
        background-color: #000000;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
      }
      
      /* Matrix Canvas Background */
      #matrix-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
      }

      /* Scanline Effect */
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        z-index: 0; /* Behind content, in front of canvas */
        pointer-events: none;
        opacity: 0.3;
      }
      
      /* CRT Vignette */
      .vignette {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
        z-index: 1;
        pointer-events: none;
      }

      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1"
  }
}
</script>
</head>
  <body>
    <canvas id="matrix-bg"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div id="root" style="position: relative; z-index: 10;"></div>
    
    <script>
      const canvas = document.getElementById('matrix-bg');
      const ctx = canvas.getContext('2d');

      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;

      const columns = Math.floor(width / 20); // Width of column
      const drops = [];

      for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100; // Randomize start times
      }

      // Katakana + Numbers + Symbols
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン";

      function draw() {
        // Black with opacity for trail effect
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(0, 0, width, height);

        ctx.font = '16px monospace';

        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          
          // Color Logic: Mostly Orange, some Amber, rare White/Yellow for glitch
          const randomColor = Math.random();
          if (randomColor > 0.98) {
             ctx.fillStyle = '#ffffff'; // White glitch
          } else if (randomColor > 0.90) {
             ctx.fillStyle = '#fbbf24'; // Amber glitch
          } else {
             ctx.fillStyle = '#f97316'; // Orange-500 base
          }
          
          ctx.fillText(text, i * 20, drops[i] * 20);

          // Reset drop if it goes off screen (with randomness)
          if (drops[i] * 20 > height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }

      setInterval(draw, 33); // ~30 FPS

      window.addEventListener('resize', () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>
